# site 的业务声明:门户是纯静态 JS 站点,没有 MoonBit 模块,以下能力位全部留空。
# 提交规范与钩子(骨架)仍然生效;DEVKIT_SRC 保留默认 src/,门户没有该目录,
# 因此所有提交都命中「无源码暂存」而跳过编译门,这是预期行为。

DEVKIT_NAME="site"

DEVKIT_MODULE=""

DEVKIT_SRC="src/"

DEVKIT_TARGETS=""

DEVKIT_BUILDS=""

DEVKIT_CHECKS=""

DEVKIT_VERSION_FILE=""

DEVKIT_ENV=""

DEVKIT_E2E=""

DEVKIT_SOAK=""
